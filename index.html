<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">

        <h1>Password Generator</h1>

        <div class="display-generator">
            <input readonly placeholder="Password" class="display" data-passwordDisplay>

            <button data-copy>
                <span data-copyMsg></span>
                <img src="assets/copy.svg" alt="Copy" height="23" width="23">
            </button>
        </div>

        <div class="input-container">

            <div class="length-container">
                <p>Password Length</p>
                <p data-lengthNumber>10</p>
            </div>

            <input type="range" min="1" max="20" class="slider" step="1" data-lengthSlider>

            <!-- Checkboxes -->
            <div class="check-container">
                <label for="uppercase">
                    <input type="checkbox" id="uppercase">
                    Include Uppercase Letters
                </label>
                <label for="lowercase">
                    <input type="checkbox" id="lowercase">
                    Include Lowercase Letters
                </label>
                <label for="numbers">
                    <input type="checkbox" id="numbers">
                    Include Numbers
                </label>
                <label for="symbols">
                    <input type="checkbox" id="symbols">
                    Include Symbols
                </label>
            </div>

            <div class="strength-container">
                <p>Strength</p>
                <div data-indicator></div>
            </div>

            <button class="generate-password">Generate Password</button>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
